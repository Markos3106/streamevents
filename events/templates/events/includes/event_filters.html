<div class="card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3">
            <div class="col-md-4">
                {{ search_form.search }}
            </div>
            <div class="col-md-2">
                {{ search_form.category }}
            </div>
            <div class="col-md-2">
                {{ search_form.status }}
            </div>
            <div class="col-md-2">
                {{ search_form.date_from }}
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary"><i class="fas fa-search me-1"></i> Cercar</button>
            </div>
        </form>
    </div>
</div>

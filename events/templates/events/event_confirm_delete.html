{% extends 'base.html' %}

{% block title %}Eliminar Esdeveniment - StreamEvents{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Confirmar Eliminació</h4>
            </div>
            <div class="card-body">
                <p class="lead">Estàs segur que vols eliminar l'esdeveniment:</p>
                <h3 class="text-center my-4">{{ event.title }}</h3>
                <p class="text-muted small">Aquesta acció no es pot desfer.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">Sí, eliminar definitivament</button>
                        <a href="{{ event.get_absolute_url }}" class="btn btn-secondary">Cancel·lar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Iniciar sessió{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2>Iniciar sessió</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="mb-3">
          <label for="id_username" class="form-label">Usuari o Email</label>
          {{ form.username }}
          {{ form.username.errors }}
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Contrasenya</label>
          {{ form.password }}
          {{ form.password.errors }}
        </div>
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
    </div>
  </div>
{% endblock %}

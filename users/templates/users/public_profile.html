{% extends "base.html" %}
{% block content %}
  <div class="card">
    <div class="card-body text-center">
      {% if profile_user.avatar %}
        <img src="{{ profile_user.avatar.url }}" class="rounded-circle mb-2" style="max-width:130px;">
      {% else %}
        <i class="fa-regular fa-user fa-5x text-muted mb-2"></i>
      {% endif %}
      <h4>{{ profile_user.display_name|default:profile_user.username }}</h4>
      <p>{{ profile_user.bio|default:"Sense bio" }}</p>
      <p><small>{{ profile_user.email }}</small></p>
    </div>
  </div>
{% endblock %}
